<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent runs · Local monitor</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="/app.js" defer></script>
  </head>
  <body>
    <div class="shell">
      <header class="masthead">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">A<span>↗</span></span
          ><span>ORCHESTRATOR <small>/ LOCAL MONITOR</small></span>
        </div>
        <div class="connection">
          <span class="connection-dot" aria-hidden="true"></span> Chỉ đọc ·
          127.0.0.1
        </div>
      </header>
      <main>
        <div class="intro">
          <div>
            <p class="eyebrow">WORKER ACTIVITY</p>
            <h1>Agent runs</h1>
            <p class="subheading">
              Theo dõi CLI nào đang làm việc, ở worktree nào và test có qua
              không.
            </p>
          </div>
          <button id="refresh" type="button" class="refresh">
            ↻ <span>Làm mới</span>
          </button>
        </div>
        <section
          aria-label="Tổng quan"
          id="overview"
          class="overview"
        ></section>
        <div class="section-title">
          <h2>Lịch sử chạy</h2>
          <span id="updated" aria-live="polite"></span>
        </div>
        <div id="message" role="status" aria-live="polite"></div>
        <div id="runs" class="runs" aria-live="off"></div>
      </main>
      <footer>
        Dữ liệu chỉ đọc từ Git metadata · Làm mới tự động mỗi 4 giây · Tối đa 50
        run gần đây
      </footer>
    </div>
  </body>
</html>
